name: Build Binaries

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml openpyxl PySide6 pyinstaller
      
      - name: Build ectd-tool (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile \
            --dist dist \
            --build-dir build \
            ectd-tool.py
      
      - name: Build ectd-viewer (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile \
            --dist dist \
            --build-dir build \
            ectd-viewer.py
      
      - name: Build ectd-tool (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile `
            --dist dist `
            --build-dir build `
            ectd-tool.py
      
      - name: Build ectd-viewer (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile `
            --dist dist `
            --build-dir build `
            ectd-viewer.py
      
      - name: Upload Ubuntu artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ectd-tools-ubuntu
          path: dist/
          retention-days: 90
      
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ectd-tools-windows
          path: dist/
          retention-days: 90
  
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
