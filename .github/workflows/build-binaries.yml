name: Build Rust Binaries

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable-suffix: ''
            archive-suffix: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            executable-suffix: .exe
            archive-suffix: zip
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo dependencies and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build both release binaries
        run: cargo build --release --locked --bins

      - name: Prepare distribution
        run: |
          mkdir -p dist/package/resources
          cp target/release/ectd-tool${{ matrix.executable-suffix }} target/release/ectd-viewer${{ matrix.executable-suffix }} dist/package/
          cp LICENSE README.md TOOL.md dist/package/
          cp resources/* dist/package/resources/

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        run: tar -czf dist/ectd-tools-${{ matrix.platform }}.tar.gz -C dist/package .

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath dist/ectd-tools-${{ matrix.platform }}.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ectd-tools-${{ matrix.platform }}
          path: dist/ectd-tools-${{ matrix.platform }}.${{ matrix.archive-suffix }}
          if-no-files-found: error
          retention-days: 90

  create-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: ectd-tools-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
