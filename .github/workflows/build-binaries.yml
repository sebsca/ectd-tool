name: Build Windows Binaries

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml openpyxl PySide6 pyinstaller

      - name: Build ectd-tool
        run: |
          pyinstaller --onefile `
            --distpath dist `
            --workpath build `
            ectd-tool.py

      - name: Build ectd-viewer
        run: |
          pyinstaller --onefile `
            --distpath dist `
            --workpath build `
            ectd-viewer.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ectd-tools-windows
          path: dist/
          retention-days: 90

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
